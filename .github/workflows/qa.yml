name: QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  source-portability:
    name: Source QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck application and review entry
        run: pnpm typecheck && pnpm typecheck:review
      - name: Run hermetic tests
        run: pnpm test
      - name: Build web and review entries
        run: pnpm build:web && pnpm build:review

  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Audit critical dependency vulnerabilities
        run: pnpm audit --audit-level critical
      - name: Typecheck application and review entry
        run: pnpm typecheck && pnpm typecheck:review
      - name: Run hermetic tests
        run: pnpm test
      - name: Build packaged application
        run: pnpm build
      - name: Build independent review module
        run: pnpm build:review
      - name: Run packaged desktop E2E
        env:
          PACKAGED_E2E_VISIBLE: "1"
        run: pnpm test:e2e:packaged
