name: QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit critical dependency vulnerabilities
        run: pnpm audit --audit-level critical
      - name: Typecheck application and review entry
        run: pnpm typecheck && pnpm typecheck:review
      - name: Run hermetic tests
        run: pnpm test
      - name: Build packaged application
        run: pnpm build
      - name: Build independent review module
        run: pnpm build:review
      - name: Run packaged desktop E2E
        run: pnpm test:e2e:packaged
