name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected) throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)"
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Publish a new version instead of replacing assets."
            exit 1
          fi
      - name: Locate Chrome for browser regression tests
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Google/Chrome/Application/chrome.exe", "$env:LOCALAPPDATA/Google/Chrome/Application/chrome.exe")
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Chrome is required for release browser tests" }
          "QA_CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Audit all high dependencies and verify application, review module and packaged runtime
        env:
          PACKAGED_E2E_VISIBLE: "1"
        run: pnpm verify:release

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Build native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist:platform
      - name: Verify packaged artifact
        shell: bash
        run: |
          node qa/verify-release-artifact.cjs release-builder "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Smoke-test Linux AppImage contents
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x release-builder/*.AppImage
          release-builder/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          node -e "const {readPackagedPackageJson}=require('./qa/delivery-verification.cjs'); const p=readPackagedPackageJson('squashfs-root'); const v=require('./package.json').version; if(p.version!==v) throw new Error('Embedded AppImage version mismatch: '+p.version+' != '+v)"
          node electron/build-runtime-fuses.cjs squashfs-root/a-share-quant-radar --verify
      - name: Verify packaged macOS archive
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          for archive in release-builder/A-Share-Quant-Radar-*.zip; do
            /usr/bin/ditto -x -k "$archive" "$smoke_dir"
          done
          shopt -s nullglob
          apps=("$smoke_dir"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          test -x "$app/Contents/MacOS/A股雷达"
          SMOKE_APP="$app" node -e "const {readPackagedPackageJson}=require('./qa/delivery-verification.cjs'); const p=readPackagedPackageJson(process.env.SMOKE_APP); const v=require('./package.json').version; if(p.version!==v) throw new Error('Embedded macOS version mismatch: '+p.version+' != '+v)"
          node qa/verify-mac-delivery.cjs "$app"
          node electron/build-runtime-fuses.cjs "$app/Contents/MacOS/A股雷达" --verify
      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: release-builder/A-Share-Quant-Radar-*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum A-Share-Quant-Radar-* | sort -k 2 > SHA256SUMS.txt
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          created_draft=0
          cleanup_draft() {
            if [ "$created_draft" -eq 1 ]; then
              gh release delete "$RELEASE_TAG" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          created_draft=1
          gh release upload "$RELEASE_TAG" release-assets/*
          expected_count=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Release asset count mismatch: expected $expected_count, received $actual_count"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          created_draft=0
