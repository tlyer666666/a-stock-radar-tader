name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Audit critical dependency vulnerabilities
        run: pnpm audit --audit-level critical
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected) throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)"
      - name: Allow only a recoverable automation draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_error="$(mktemp)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>"$release_error"; then
            release_info="$(gh release view "$RELEASE_TAG" --json isDraft,author,body --jq \
              '[.isDraft, .author.login, ((.body // "") | contains("<!-- a-stock-radar-release-workflow -->"))] | @tsv')"
            IFS=$'\t' read -r is_draft author has_marker <<< "$release_info"
            unexpected_assets="$(gh release view "$RELEASE_TAG" --json assets --jq \
              '[.assets[].name | select(((startswith("A-Share-Quant-Radar-") or . == "SHA256SUMS.txt")) | not)] | length')"
            if [ "$is_draft" = "true" ] && [ "$author" = "github-actions[bot]" ] && \
              { [ "$has_marker" = "true" ] || [ "$unexpected_assets" = "0" ]; }; then
              echo "An incomplete automation draft will be replaced by the final publisher."
            else
              echo "Release $RELEASE_TAG already exists and is not a recoverable automation draft."
              echo "Publish a new version instead of replacing assets."
              rm -f "$release_error"
              exit 1
            fi
          elif ! grep -Eqi "release not found|HTTP 404" "$release_error"; then
            cat "$release_error" >&2
            rm -f "$release_error"
            exit 1
          fi
          rm -f "$release_error"
      - name: Verify application, review module and packaged runtime
        env:
          PACKAGED_E2E_VISIBLE: "1"
        run: pnpm verify:release

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Build native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist:platform
      - name: Verify packaged artifact
        shell: bash
        run: |
          node qa/verify-release-artifact.cjs release-builder "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Smoke-test Windows portable ZIP contents
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          node qa/verify-windows-release-zip.cjs release-builder "${{ matrix.arch }}"
          node qa/packaged-app.cjs "release-builder/windows-smoke/A股雷达.exe"
      - name: Smoke-test Linux AppImage contents
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x release-builder/*.AppImage
          release-builder/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('squashfs-root/resources/app/package.json','utf8')); if(p.version!==require('./package.json').version) throw new Error('Embedded AppImage version mismatch')"
      - name: Verify macOS application bundle contents
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p release-builder/macos-smoke
          unzip -q release-builder/*.zip -d release-builder/macos-smoke
          test -x release-builder/macos-smoke/*.app/Contents/MacOS/*
          node -e "const fs=require('fs'),path=require('path'); const app=fs.readdirSync('release-builder/macos-smoke').find(x=>x.endsWith('.app')); const p=JSON.parse(fs.readFileSync(path.join('release-builder/macos-smoke',app,'Contents','Resources','app','package.json'),'utf8')); if(p.version!==require('./package.json').version) throw new Error('Embedded macOS version mismatch')"
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-builder/A-Share-Quant-Radar-*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Remove an incomplete automation draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_error="$(mktemp)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>"$release_error"; then
            release_info="$(gh release view "$RELEASE_TAG" --json isDraft,author,body --jq \
              '[.isDraft, .author.login, ((.body // "") | contains("<!-- a-stock-radar-release-workflow -->"))] | @tsv')"
            IFS=$'\t' read -r is_draft author has_marker <<< "$release_info"
            unexpected_assets="$(gh release view "$RELEASE_TAG" --json assets --jq \
              '[.assets[].name | select(((startswith("A-Share-Quant-Radar-") or . == "SHA256SUMS.txt")) | not)] | length')"
            if [ "$is_draft" = "true" ] && [ "$author" = "github-actions[bot]" ] && \
              { [ "$has_marker" = "true" ] || [ "$unexpected_assets" = "0" ]; }; then
              echo "Removing incomplete automation draft $RELEASE_TAG before publishing."
              gh release delete "$RELEASE_TAG" --yes
            else
              echo "Release $RELEASE_TAG became non-recoverable while native packages were building."
              rm -f "$release_error"
              exit 1
            fi
          elif ! grep -Eqi "release not found|HTTP 404" "$release_error"; then
            cat "$release_error" >&2
            rm -f "$release_error"
            exit 1
          fi
          rm -f "$release_error"
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum A-Share-Quant-Radar-* | sort -k 2 > SHA256SUMS.txt
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_AUTOMATION_MARKER: "<!-- a-stock-radar-release-workflow -->"
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft \
            --notes "$RELEASE_AUTOMATION_MARKER"
          gh release upload "$RELEASE_TAG" release-assets/*
          expected_count=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Release asset count mismatch: expected $expected_count, received $actual_count"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
