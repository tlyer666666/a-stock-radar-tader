name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected) throw new Error('Tag '+process.env.RELEASE_TAG+' does not match '+expected)"
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Publish a new version instead of replacing assets."
            exit 1
          fi
      - name: Locate Chrome for browser regression tests
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles/Google/Chrome/Application/chrome.exe", "${env:ProgramFiles(x86)}/Google/Chrome/Application/chrome.exe", "$env:LOCALAPPDATA/Google/Chrome/Application/chrome.exe")
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Chrome is required for release browser tests" }
          "QA_CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # D-07（第二轮审核）：这 4 组浏览器套件既不在 qa.yml，也不在 package.json 的
      # verify:release 里，长期只能靠人工发现回归。发布门禁补回这 4 步，
      # 与 qa.yml 的 browser 作业保持一致（Chrome 路径已由上一步写入 QA_CHROMIUM_PATH）。
      - name: Stability browser suite
        run: pnpm qa:stability:ui
      - name: UI remediation browser suite
        run: pnpm qa:ui-remediation
      - name: Sector panel browser suite
        run: pnpm qa:sector:ui
      - name: Workspace workflow browser suite
        run: pnpm qa:workflow
      - name: Audit all high dependencies and verify application, review module and packaged runtime
        env:
          PACKAGED_E2E_VISIBLE: "1"
        run: pnpm verify:release

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Electron desktop runtime
        run: pnpm ensure:electron
      - name: Build native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist:platform
      - name: Verify packaged artifact
        shell: bash
        run: |
          node qa/verify-release-artifact.cjs release-builder "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Smoke-test Linux AppImage contents
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x release-builder/*.AppImage
          release-builder/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          node -e "const {readPackagedPackageJson}=require('./qa/delivery-verification.cjs'); const p=readPackagedPackageJson('squashfs-root'); const v=require('./package.json').version; if(p.version!==v) throw new Error('Embedded AppImage version mismatch: '+p.version+' != '+v)"
      - name: Verify macOS application bundle contents
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p release-builder/macos-smoke
          unzip -q release-builder/*.zip -d release-builder/macos-smoke
          test -x release-builder/macos-smoke/*.app/Contents/MacOS/*
          node -e "const fs=require('fs'),path=require('path'); const {readPackagedPackageJson}=require('./qa/delivery-verification.cjs'); const app=fs.readdirSync('release-builder/macos-smoke').find(x=>x.endsWith('.app')); const p=readPackagedPackageJson(path.join('release-builder/macos-smoke',app)); const v=require('./package.json').version; if(p.version!==v) throw new Error('Embedded macOS version mismatch: '+p.version+' != '+v)"
          for app in release-builder/macos-smoke/*.app; do
            # 先核验上传的压缩包原样解出的内容：熔断位必须关闭（不经过重签名）。
            for exe in "$app"/Contents/MacOS/*; do node electron/build-runtime-fuses.cjs "$exe" --verify; done
            # 再在副本上补 ad-hoc 签名，核验 asar 完整性、版本一致和包封条。
            copy="release-builder/macos-smoke/verify-copy.app"
            rm -rf "$copy"; ditto "$app" "$copy"
            codesign --force --deep --sign - "$copy"
            node qa/verify-mac-delivery.cjs "$copy"
            rm -rf "$copy"
          done
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-builder/A-Share-Quant-Radar-*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum A-Share-Quant-Radar-* | sort -k 2 > SHA256SUMS.txt
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft
          gh release upload "$RELEASE_TAG" release-assets/*
          expected_count=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Release asset count mismatch: expected $expected_count, received $actual_count"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
