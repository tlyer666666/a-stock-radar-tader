allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
# Keep direct pins unchanged. minimatch 11 is the only fixed algorithm; its
# tracked CJS bridge preserves legacy callable exports (see compatibility tests).
overrides:
  nanoid@3.3.16: 3.3.18
  nanoid@3.3.17: 3.3.18
  '@xmldom/xmldom@0.8.13': 0.8.15
  js-yaml@4.3.1: 4.3.2
  axios@1.18.1: 1.20.0
  undici@7.29.0: 7.30.1
  undici@6.28.0: 6.29.1
  fast-uri@3.1.5: 3.1.9
  joi@18.2.3: 18.3.1
  follow-redirects: 1.16.2
  minimatch: 11.0.3
  brace-expansion@1.1.18: 1.1.21
  brace-expansion@2.1.4: 2.1.7
  brace-expansion@5.0.9: 5.0.12
  http-cache-semantics: 4.3.0
  shell-quote: 1.12.0
onlyBuiltDependencies:
  - electron
  - esbuild
minimumReleaseAgeExclude:
  - electron@43.7.9
  - playwright-core@1.64.0
patchedDependencies:
  glob@7.2.3: patches/glob@7.2.3.patch
  minimatch@11.0.3: patches/minimatch@11.0.3.patch
